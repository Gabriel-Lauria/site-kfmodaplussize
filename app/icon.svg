<svg xmlns="http://www.w3.org/2000/svg" viewBox="-100 -100 200 200">
  <!-- Cada elemento de primeiro nível "desabrocha" em sequência (BrandMark bloom).
       data-delay: atraso próprio (s); data-mono="hide": some na versão de uma cor. -->
  <g transform="rotate(0)"><ellipse cx="0" cy="-50" rx="30" ry="44" fill="#F7B8D2" stroke="#3b1424" stroke-width="5"/></g>
  <g transform="rotate(60)"><ellipse cx="0" cy="-50" rx="30" ry="44" fill="#EE8DB8" stroke="#3b1424" stroke-width="5"/></g>
  <g transform="rotate(120)"><ellipse cx="0" cy="-50" rx="30" ry="44" fill="#E2589B" stroke="#3b1424" stroke-width="5"/></g>
  <g transform="rotate(180)"><ellipse cx="0" cy="-50" rx="30" ry="44" fill="#F29AC2" stroke="#3b1424" stroke-width="5"/></g>
  <g transform="rotate(240)"><ellipse cx="0" cy="-50" rx="30" ry="44" fill="#F9C9DC" stroke="#3b1424" stroke-width="5"/></g>
  <g transform="rotate(300)"><ellipse cx="0" cy="-50" rx="30" ry="44" fill="#E86FA8" stroke="#3b1424" stroke-width="5"/></g>
  <circle r="28" fill="#FCE4EE" stroke="#3b1424" stroke-width="5" data-delay="0.5" data-mono="hide"/>
</svg>
